<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; width: 300px; padding: 12px; background: #fff; color: #333; margin: 0; }
    textarea { w-full: 100%; box-sizing: border-box; width: 100%; height: 80px; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
    input { w-full: 100%; box-sizing: border-box; width: 100%; padding: 6px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 8px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #2563eb; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .row { display: flex; gap: 8px; }
    .status { margin-top: 8px; font-size: 12px; text-align: center; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h3 style="margin-top:0; margin-bottom: 12px; font-size:16px;">Temporal Dev Room</h3>
  <div class="row">
    <input type="text" id="roomId" placeholder="Room ID" />
    <input type="password" id="passcode" placeholder="Passcode (opt)" />
  </div>
  <textarea id="content" placeholder="Paste snippet here..."></textarea>
  <button id="sendBtn">Send to Room</button>
  <div id="status" class="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
